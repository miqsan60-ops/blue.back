# ===============================
# PUERTO (Render asigna)
# ===============================
server.port=${PORT:8080}

# ===============================
# CONEXIÓN A MYSQL PRODUCCIÓN
# ===============================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# ddl-auto: 'update' mantiene la DB, 'validate' solo valida estructura
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# CORS / RECURSOS
# ===============================
spring.web.resources.add-mappings=false

# ===============================
# CONFIGURACIÓN EMAIL (GMAIL)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ===============================
# MERCADOPAGO
# ===============================
mercadopago.access-token=${MP_ACCESS_TOKEN}
